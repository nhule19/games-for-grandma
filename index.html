<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindful Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game-container menu-container">

    <div class="menu-badge" aria-hidden="true">
      <svg viewBox="0 0 56 56">
        <circle class="ring-outer" cx="28" cy="28" r="24"></circle>
        <circle class="ring-inner" cx="28" cy="28" r="14"></circle>
      </svg>
    </div>

    <h1>Mindful Games</h1>

    <p class="instructions">Choose a game to play.</p>

    <div class="game-selection">

      <a href="matching.html" class="game-option">
        <div class="game-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="9" r="5.5"></circle>
            <circle cx="15" cy="15" r="5.5"></circle>
          </svg>
        </div>
        <div class="game-option-text">
          <h2>Matching Game</h2>
          <p>Find two pictures that match.</p>
        </div>
        <span class="game-arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="sorting.html" class="game-option">
        <div class="game-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="3"></circle>
            <circle cx="16" cy="8" r="3"></circle>
            <circle cx="12" cy="16" r="3"></circle>
          </svg>
        </div>
        <div class="game-option-text">
          <h2>Color Sorting</h2>
          <p>Sort the colors into the correct groups.</p>
        </div>
        <span class="game-arrow" aria-hidden="true">&rarr;</span>
      </a>

    </div>

    <p class="menu-note">More games will be added later. Stay tuned!</p>

  </main>

</body>
</html>
